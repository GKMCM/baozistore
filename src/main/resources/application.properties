spring.application.name=baozistore

# ---------- Banco de dados: MySQL ----------
# O banco "baozistore" e criado automaticamente na primeira execucao.
# Os valores podem ser trocados pelas variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/baozistore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update: cria/atualiza as tabelas a partir das entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Servidor ----------
server.port=8080
# inclui a mensagem de erro no corpo das respostas 4xx (ajuda nos testes com o Postman)
server.error.include-message=always
